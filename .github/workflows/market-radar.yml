name: Market Radar

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.py'
      - requirements.txt
      - .github/workflows/market-radar.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'market-radar-live' }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  scan:
    permissions:
      contents: write
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run market radar and save structured scan
        env:
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_radar.py
      - name: Publish material scan changes to rolling feed PR
        run: python publish_alert.py
      - name: Persist research outcomes
        if: always()
        run: python outcome_tracker.py
      - name: Save scan and bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-diagnostics-${{ github.run_id }}
          path: |
            latest_scan.json
            bridge_status.json
            radar_outcomes.json
            outcome_summary.json
            chart_samples.json
            scan_state.json
          retention-days: 7
          if-no-files-found: warn

  replay:
    needs: scan
    if: ${{ always() && needs.scan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: radar-diagnostics-${{ github.run_id }}
      - name: Replay captured charts without future bars
        run: python replay_charts.py
      - uses: actions/upload-artifact@v4
        with:
          name: radar-replay-${{ github.run_id }}
          path: replay_report.json
          retention-days: 7

