name: Market Radar

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: market-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Run market radar and save structured scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_radar.py
      - name: Publish qualifying scan to ChatGPT event bridge
        run: python publish_alert.py
      - name: Save scan and bridge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-diagnostics-${{ github.run_id }}
          path: |
            latest_scan.json
            bridge_status.json
          retention-days: 7
          if-no-files-found: warn
